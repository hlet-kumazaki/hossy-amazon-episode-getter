name: Test Apple channel page fetch (manual only)

# Apple Podcasts のチャンネルページが GitHub のサーバーから読めるかを確かめるための試験用。
# 手動でしか動かない。WordPress には何も書き込まない。
on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fetch channel page and look for latest episodes
        run: |
          set -u
          UA='Mozilla/5.0 (Macintosh; Intel Mac OS X 14_0) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/17.0 Safari/605.1.15'
          URL='https://podcasts.apple.com/jp/podcast/id1810690058'
          for i in 1 2 3; do
            echo "=== attempt $i"
            curl -sL -A "$UA" -H 'Accept-Language: ja-JP,ja;q=0.9' "$URL" -o page.html \
              -w 'http=%{http_code} bytes=%{size_download} final=%{url_effective}\n' || echo "curl failed"
            echo "serialized-server-data: $(grep -c 'serialized-server-data' page.html || true)"
            echo "episode titles found:"
            grep -oE 'Episode [0-9]+｜' page.html | sort -u | sort -t' ' -k2 -n | tail -4 || true
            echo "episode URLs found: $(grep -oE 'id1810690058\?i=1000[0-9]+' page.html | sort -u | wc -l)"
            grep -oE '"https://podcasts\.apple\.com/jp/podcast/episode-83[^"]*"' page.html | head -1 | sed -E 's/(.{80}).*(\?i=[0-9]+).*/\1...\2/' || true
            sleep 3
          done
          echo "=== runner IP"
          curl -s https://api.ipify.org; echo
